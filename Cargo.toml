[package]
name = "stellar-bounty-contracts"
version = "4.0.0"
edition = "2021"
description = "Production Soroban smart contracts for milestone-based conditional escrow, multi-recipient settlement routing, and trustless refund recovery on Stellar"
repository = "https://github.com/Stellar-Bounty-Treasury/stellar-bounty-contracts"
license = "MIT"
authors = ["Dev3DPrint <322404527+Dev3DPrint@users.noreply.github.com>"]
keywords = ["stellar", "soroban", "smart-contracts", "escrow", "settlement-router"]
categories = ["cryptography::cryptocurrencies", "finance"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "22.0.11", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "22.0.11", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
